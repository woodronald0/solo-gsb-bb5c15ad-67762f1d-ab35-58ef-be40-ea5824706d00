services:
  timeline-checker:
    build: .
    image: oral-history-timeline:latest
    container_name: oral-history-timeline
    ports:
      - "8080:8080"
    environment:
      # 容器内监听地址与端口；修改左侧宿主机端口可更换访问端口
      - HOST=0.0.0.0
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
